[package]
name = "robotarm_protocol"
version = "0.1.0"
edition = "2024"

[features]
default = []
defmt = ["dep:defmt"]

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["experimental-derive"] }
serde = { version = "1.0", default-features = false }
serde_arrays = "0.2.0"
heapless = { version = "0.9.3", default-features = false, features = ["serde"] }
defmt = { version = "1.2.0", optional = true }
crc32fast = { version = "1.5.5", default-features = false }