[package]
name = "robotarm_server"
version = "0.1.0"
edition = "2024"

[dependencies]

robotarm_protocol = { path = "../robotarm_protocol" }

postcard = { version = "1.1.3", default-features = false, features = ["use-std", "use-crc"] }
crc32fast = { version = "1.5.5", default-features = false }
serde = "1.0.228"

tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.19", features = [
    "local-time",
    "env-filter",
    "json",
    "registry",
] }
env_logger = "0.11.8"
anyhow = "1.0.101"

tokio = { version = "1.54.1", features = ["full"] }
futures-util = "0.3.34"

# tungstenite = "0.30.0"
tokio-tungstenite = { version = "0.30.0", features = [] }
tokio-serial = { version = "5.5.0", features = [] }

rpi-pal = { version = "0.22.3", features = [] }
serialport = { version = "4.10.1", default-features = false, features = [] }
